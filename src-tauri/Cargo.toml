[package]
name = "zeta-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
password-vault-prototype = ["wallet-core/password-vault-prototype", "app-core/password-vault-prototype"]

[lints]
workspace = true

[build-dependencies]
tauri-build.workspace = true

[dependencies]
agent-core.workspace = true
app-core.workspace = true
base64.workspace = true
chain-evm.workspace = true
computation-runtime.workspace = true
evm-simulation.workspace = true
filesystem-tools.workspace = true
getrandom.workspace = true
ipc-types.workspace = true
minisign-verify.workspace = true
model-runtime.workspace = true
regex.workspace = true
reqwest.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sha3.workspace = true
tauri.workspace = true
tauri-plugin-dialog.workspace = true
tempfile.workspace = true
time.workspace = true
tokio.workspace = true
transaction-policy.workspace = true
uuid.workspace = true
wallet-core.workspace = true
zeroize.workspace = true
web-retrieval.workspace = true
x402-client.workspace = true
xattr.workspace = true

[dev-dependencies]
web-retrieval = { workspace = true, features = ["test-support"] }
app-core = { workspace = true, features = ["test-support"] }
image.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
desktop-lifecycle.workspace = true
objc2.workspace = true
objc2-app-kit = { workspace = true, features = ["NSAlert", "NSApplication", "NSButton", "NSControl", "NSResponder", "NSRunningApplication", "NSScreen", "NSScrollView", "NSSecureTextField", "NSText", "NSTextContainer", "NSTextField", "NSTextView", "NSView", "NSWindow"] }
objc2-foundation = { workspace = true, features = ["NSArray", "NSData", "NSError", "NSGeometry", "NSString", "NSURL"] }
security-framework.workspace = true
security-framework-sys.workspace = true
