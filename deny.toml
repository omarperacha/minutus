[advisories]
yanked = "deny"
# Existing maintenance exceptions and the separately bounded simulation timing
# applicability exception. The policy wrapper enforces exact graphs and expiry.
ignore = [
    # Affected public verification arithmetic only, never the wallet signing graph.
    # Exact packages/checksums/consumers and 2027-01-30 UTC expiry are enforced by
    # simulation_dependency_policy.py. This version remains affected, not patched.
    { id = "RUSTSEC-2026-0387", reason = "crypto-bigint 0.5.5 is used for public EVM recovery/verification under the exact bounded graph in docs/local-simulation-dependency-review.md; wallet-core uses patched 0.7.9 and cannot reach 0.5.5. Re-review before 2027-01-30 or any graph/use change. No secret arithmetic is qualified." },
    # Temporary exception, expires 2027-10-13; exact dependency path and deadline
    # are enforced by scripts/check_dependency_policy.py (also used in public CI).
    { id = "RUSTSEC-2024-0436", reason = "Unmaintained compile-time paste 1.0.15 via tokenizers 0.22.2. Stable 0.23.2 still depends on paste; review by 2027-10-13 or any dependency-path change. See docs/dependency-maintenance.md in the public repo." },
    # Unmaintained proc-macro-error used by Tauri's transitive build tooling.
    "RUSTSEC-2024-0370",
    # Legacy Unicode crates used by Tauri's URL-pattern implementation.
    "RUSTSEC-2025-0075",
    "RUSTSEC-2025-0080",
    "RUSTSEC-2025-0081",
    "RUSTSEC-2025-0098",
    "RUSTSEC-2025-0100",
]

[licenses]
confidence-threshold = 0.93
unused-allowed-license = "allow"
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]

# Reviewed on 2026-10-13 for the locked wallet-recovery dependency chain.
# CC0 grants no patent rights (section 4(a)); that limitation is accepted for
# these exact package versions only. Review upgrades rather than globally
# allowing CC0. See docs/license-policy.md in the public source repository.
[[licenses.exceptions]]
name = "bip39"
version = "=2.2.2"
allow = ["CC0-1.0"]

[[licenses.exceptions]]
name = "bitcoin_hashes"
version = "=0.14.101"
allow = ["CC0-1.0"]

[[licenses.exceptions]]
name = "hex-conservative"
version = "=0.2.2"
allow = ["CC0-1.0"]

# New source/licence review on 2026-10-30; not inherited from wallet exceptions.
# CC0 patent/trademark limitation and exact source/parents/checksum are recorded
# in docs/local-simulation-dependency-review.md; wrapper expiry is 2027-01-30.
[[licenses.exceptions]]
name = "aurora-engine-modexp"
version = "=1.3.0"
allow = ["CC0-1.0"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

# Reviewed compatibility baseline, 2026-10-24: Tauri/platform bindings, build
# tooling and the two supported RustCrypto generations require these older
# versions. Skip only their duplicate warnings; advisories/licences/sources still
